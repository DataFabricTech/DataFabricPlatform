; Data Quality Metrics (profiling) 설정 템플릿
;
; 사용법:
;   1) 이 파일과 로깅 설정을 복사합니다.
;        cp config_templates/config.ini  config.ini
;        cp config_templates/logging.ini logging.ini
;   2) .env 에 설정 파일 경로를 지정합니다.
;        CONFIG_FILE=config.ini
;   3) 아래 값을 환경에 맞게 채웁니다.

[security]
; 암호화 키. postgres.password 를 이 키로 암호화해 기록합니다.
cryptkey = <CRYPT_KEY>

[postgres]
; 산출된 품질 지표를 저장할 PostgreSQL
host     = <POSTGRES_HOST>
port     = 5432
database = <POSTGRES_DATABASE>
user     = <POSTGRES_USER>
; cryptkey 로 암호화된 값을 기록합니다 (평문 아님)
password = <ENCRYPTED_POSTGRES_PASSWORD>

[trino]
; 대상 데이터를 조회할 Trino (가상화 계층)
host = <TRINO_HOST>
port = 8080
user = <TRINO_USER>

[profiling]
; 로깅 설정 파일 경로.
; logging.config.fileConfig() 로 읽으므로 반드시 ini 형식입니다 (YAML 불가).
; 파일이 없으면 실행이 중단됩니다. logging.ini 를 복사해 사용하세요.
;   cp config_templates/logging.ini logging.ini
log_config_file = logging.ini

; 병렬 워커 수. 0 이면 cpu_ratio 로 자동 계산
workers     = 0
; 대용량 테이블 전용 워커 수
big_workers = 1
; workers=0 일 때 사용할 CPU 비율
cpu_ratio   = 0.5

; 테이블당 샘플링 상한 행 수
limit_rows  = 1000000

; 증분 프로파일링 사용 여부
incremental  = false
; 증분 모드에서 재산출 주기(일)
refresh_days = 7
