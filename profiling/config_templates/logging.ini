; 로깅 설정 템플릿
;
; config.ini 의 profiling.log_config_file 이 이 파일을 가리킵니다.
; logging.config.fileConfig() 로 읽으므로 반드시 ini 형식이어야 합니다 (YAML 불가).
;
; 로거 이름은 profiling 입니다. get_logger() 가 이 이름으로 조회합니다.

[loggers]
keys=root,profiling

[handlers]
keys=console,file

[formatters]
keys=simple

[logger_root]
level=INFO
handlers=console

[logger_profiling]
level=INFO
handlers=console,file
qualname=profiling
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_file]
class=handlers.TimedRotatingFileHandler
level=INFO
formatter=simple
; (파일경로, 주기, 간격, 보관개수)
args=('logs/profiling.log', 'midnight', 1, 30)

[formatter_simple]
format=%(asctime)s %(levelname)s [%(name)s] %(message)s
datefmt=%Y-%m-%d %H:%M:%S
